name: build-opencode-android

# Weekly: track latest stable upstream opencode v2 and publish pure
# Termux/Android-arm64 builds (side-by-side `opencode2`, never `opencode`).
on:
  schedule:
    - cron: '0 6 * * *' # Everyday 06:00 UTC
  workflow_dispatch:
    inputs:
      upstream_tag:
        description: 'Upstream tag to build (e.g. v2.0.24). Empty = latest stable v2.'
        required: false
        default: ''
      version_suffix:
        description: 'Termux package revision. Bump (e.g. 2) when rebuilding the same upstream tag with new patches.'
        required: false
        default: '1'

permissions:
  contents: write

env:
  ZIG_VERSION: 0.16.0
  NDK_VERSION: r28b
  NDK_DIR: /opt/android-ndk
  REPO_UPSTREAM: anomalyco/opencode

jobs:
  resolve:
    runs-on: ubuntu-24.04
    outputs:
      upstream_tag: ${{ steps.ver.outputs.upstream_tag }}
      version_suffix: ${{ steps.ver.outputs.version_suffix }}
      release_tag: ${{ steps.ver.outputs.release_tag }}
      should_build: ${{ steps.ver.outputs.should_build }}
      reset: ${{ steps.ver.outputs.reset }}
      opentui_version: ${{ steps.ver.outputs.opentui_version }}
      bun_version: ${{ steps.ver.outputs.bun_version }}
      pty_version: ${{ steps.ver.outputs.pty_version }}
      bun_pty_version: ${{ steps.ver.outputs.bun_pty_version }}
    steps:
      - name: Resolve versions
        id: ver
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_TAG: ${{ inputs.upstream_tag }}
          INPUT_SUFFIX: ${{ inputs.version_suffix }}
          EVENT: ${{ github.event_name }}
        run: |
          TAG="${INPUT_TAG}"
          if [ -z "$TAG" ]; then
            TAG=$(curl -fsSL -H "Authorization: Bearer $GH_TOKEN" "https://api.github.com/repos/${REPO_UPSTREAM}/tags?per_page=100" | \
              python3 -c "import json,sys; print(sorted([t['name'] for t in json.load(sys.stdin) if t['name'].startswith('v2.')], key=lambda v: [int(x) for x in v[1:].split('.')])[-1])")
          fi
          PKG=$(curl -fsSL "https://raw.githubusercontent.com/${REPO_UPSTREAM}/${TAG}/package.json")
          CORE=$(curl -fsSL "https://raw.githubusercontent.com/${REPO_UPSTREAM}/${TAG}/packages/core/package.json")
          if [ "$EVENT" = "workflow_dispatch" ]; then
            # manual trigger = force rebuild, even if the release exists
            SHOULD_BUILD=true
            if gh release view "${TAG}-android" >/dev/null 2>&1; then
              RESET=true
              echo "manual run: will delete existing release ${TAG}-android first"
            else
              RESET=false
            fi
          elif gh release view "${TAG}-android" >/dev/null 2>&1; then
            SHOULD_BUILD=false
            RESET=false
            echo "release ${TAG}-android already exists, skipping"
          else
            SHOULD_BUILD=true
            RESET=false
          fi
          # Single grouped write: one redirect satisfies SC2129 and keeps
          # step outputs atomic.
          {
            echo "upstream_tag=$TAG"
            echo "version_suffix=${INPUT_SUFFIX:-1}"
            echo "release_tag=${TAG}-android"
            echo "$PKG" | python3 -c "import json,sys; d=json.load(sys.stdin); print('opentui_version='+d['workspaces']['catalog']['@opentui/core']); print('bun_version='+d['packageManager'].split('@')[1])"
            echo "$CORE" | python3 -c "import json,sys; d=json.load(sys.stdin); print('pty_version='+d['dependencies']['@opencode-ai/pty']); print('bun_pty_version='+d['dependencies']['bun-pty'])"
            echo "should_build=$SHOULD_BUILD"
            echo "reset=$RESET"
          } >> "$GITHUB_OUTPUT"

  build:
    needs: resolve
    if: needs.resolve.outputs.should_build == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      UPSTREAM_TAG: ${{ needs.resolve.outputs.upstream_tag }}
      RELEASE_TAG: ${{ needs.resolve.outputs.release_tag }}
      OPENTUI_VERSION: ${{ needs.resolve.outputs.opentui_version }}
      BUN_VERSION: ${{ needs.resolve.outputs.bun_version }}
      PTY_VERSION: ${{ needs.resolve.outputs.pty_version }}
      BUN_PTY_VERSION: ${{ needs.resolve.outputs.bun_pty_version }}
      OPENCODE_VERSION: ${{ needs.resolve.outputs.upstream_tag }}-android-termux.${{ needs.resolve.outputs.version_suffix }}
      OPENCODE_CHANNEL: android-termux
      BUN_COMPILE_RELEASE: bun-v${{ needs.resolve.outputs.bun_version }}
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Reset existing release (manual force rebuild)
        if: needs.resolve.outputs.reset == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete "${{ needs.resolve.outputs.release_tag }}" --yes --cleanup-tag
          echo "deleted release ${{ needs.resolve.outputs.release_tag }}"

      - name: Install host deps
        run: sudo apt-get update && sudo apt-get install -y wget unzip xz-utils dpkg-dev

      - name: Free runner disk (early)
        # GH runners ship GBs of unused tooling; this build additionally needs
        # NDK + Rust + all-platform node_modules before the final cleanup runs.
        run: |
          df -h / /tmp
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup \
            /opt/hostedtoolcache/CodeQL /usr/local/share/boost \
            /usr/share/swift /opt/microsoft
          sudo docker image prune --all --force 2>/dev/null || true
          df -h / /tmp

      - name: Check vendor cache (or select vendors to build)
        id: vendors
        env:
          OPENTUI_VERSION: ${{ needs.resolve.outputs.opentui_version }}
          PTY_VERSION: ${{ needs.resolve.outputs.pty_version }}
          BUN_PTY_VERSION: ${{ needs.resolve.outputs.bun_pty_version }}
        run: |
          mkdir -p out
          bash scripts/build-vendors.sh --plan >> "$GITHUB_OUTPUT"

      - name: Install Zig
        if: steps.vendors.outputs.need_libopentui == 'true'
        run: |
          cd /tmp || exit
          wget -q "https://ziglang.org/download/${ZIG_VERSION}/zig-x86_64-linux-${ZIG_VERSION}.tar.xz" -O zig.tar.xz
          tar xf zig.tar.xz
          echo "/tmp/zig-x86_64-linux-${ZIG_VERSION}" >> "$GITHUB_PATH"
          export PATH="/tmp/zig-x86_64-linux-${ZIG_VERSION}:$PATH"
          zig version

      - name: Install Android NDK
        if: steps.vendors.outputs.need_libopentui == 'true' || steps.vendors.outputs.need_pty == 'true'
        run: |
          if [ ! -d "$NDK_DIR/toolchains/llvm/prebuilt/linux-x86_64" ]; then
            cd /tmp || exit
            wget -q "https://dl.google.com/android/repository/android-ndk-${NDK_VERSION}-linux.zip" -O ndk.zip
            sudo mkdir -p /opt
            sudo unzip -q ndk.zip -d /opt/
            sudo mv "/opt/android-ndk-${NDK_VERSION}" "$NDK_DIR"
          fi

      - name: Install Rust Android target
        if: steps.vendors.outputs.need_pty == 'true'
        run: |
          rustup target add aarch64-linux-android
          rustc --version
          cargo --version

      - name: Install host Bun
        run: |
          curl -fsSL https://bun.sh/install | bash -s "bun-v${BUN_VERSION}"
          echo "$HOME/.bun/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.bun/bin:$PATH"
          test "$(bun --version)" = "${BUN_VERSION}"

      - name: Check Bun android base exists
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl -fsSL -H "Authorization: Bearer $GH_TOKEN" "https://api.github.com/repos/oven-sh/bun/releases/tags/bun-v${BUN_VERSION}" | \
            grep -q "bun-linux-aarch64-android.zip" || \
            { echo "bun v${BUN_VERSION} has no android base binary" >&2; exit 1; }

      - name: Clone upstream + apply patches
        run: |
          git clone --depth 1 --branch "${UPSTREAM_TAG}" "https://github.com/${REPO_UPSTREAM}.git" upstream
          cd upstream || exit
          git apply --check ../patches/cli-build-android.patch
          git apply ../patches/cli-build-android.patch
          git apply --check ../patches/watcher-android.patch
          git apply ../patches/watcher-android.patch
          git apply --check ../patches/tui-thinking-tap-android.patch
          git apply ../patches/tui-thinking-tap-android.patch

      - name: Install JS deps
        run: |
          export PATH="$HOME/.bun/bin:$PATH"
          cd upstream || exit
          bun install --ignore-scripts
          # harden against truncated extraction (seen with some fetch paths)
          for f in node_modules/.bun/@opentelemetry+sdk-metrics@*/node_modules/@opentelemetry/sdk-metrics/build/esm/export/AggregationTemporality.js \
                   node_modules/.bun/@opentelemetry+resources@*/node_modules/@opentelemetry/resources/build/src/detect-resources.js; do
            # shellcheck disable=SC2086  # $f holds glob patterns; expansion is intended
            if ! ls $f >/dev/null 2>&1; then echo "bun install looks truncated ($f)"; exit 1; fi
          done

      - name: Patch opentui loader for Android
        run: |
          export PATH="$HOME/.bun/bin:$PATH"
          python3 scripts/patch-opentui-loader.py upstream

      - name: Ensure vendors (stage cached, build missing, commit back)
        # Always runs: verifies + stages the vendored natives into out/, builds
        # whatever is missing from source, ELF-gates it, and commits new files
        # straight back to vendor/ (same job, no loop: this workflow has no
        # push trigger). Every later run reuses the committed files.
        env:
          REPO_ROOT: ${{ github.workspace }}
        run: bash scripts/build-vendors.sh --commit

      - name: Clean Rust build dirs (early, before embed install)
        # cargo target/ dirs are GBs; the all-platform bun install below needs
        # room (workerd/darwin/win prebuilds). Final cleanup repeats this.
        if: steps.vendors.outputs.need_pty == 'true'
        run: |
          rm -rf work/opencode-pty-*/target work/bun-pty-*/rust-pty/target ~/.cargo/registry/cache
          rm -f /tmp/ndk.zip /tmp/zig.tar.xz
          df -h / /tmp

      - name: Fetch embed deps (all-platform native packages)
        # build.ts embeds @opentui/core-linux-arm64-musl at compile time, but
        # only an --os="*"/--cpu="*" install materializes that dir. The android
        # watcher .node is located by absolute path (Bun won't resolve the
        # os:android package name on a linux host). Do it here (also runs
        # postinstall scripts like fix-node-pty) so the next step can
        # overwrite the file BEFORE the bundler reads it; the CLI build
        # then uses --skip-install and stays deterministic.
        run: |
          export PATH="$HOME/.bun/bin:$PATH"
          cd upstream || exit
          bun install --os="*" --cpu="*"
          ls -d node_modules/.bun/@opentui+core-linux-arm64-musl@*/node_modules/@opentui/core-linux-arm64-musl
          # Bun may skip os:android optionals even with --os="*"; fetch the
          # exact tarball from the registry so the bundler can resolve it.
          if ! ls -d node_modules/.bun/@parcel+watcher-android-arm64@*/node_modules/@parcel/watcher-android-arm64 2>/dev/null && \
             ! ls -d node_modules/@parcel/watcher-android-arm64 2>/dev/null; then
            WVER=$(python3 -c "import json; print(json.load(open('packages/core/package.json'))['dependencies']['@parcel/watcher'])")
            echo "bun skipped android watcher; fetching @parcel/watcher-android-arm64@$WVER"
            mkdir -p node_modules/@parcel/watcher-android-arm64
            curl -fsSL "https://registry.npmjs.org/@parcel/watcher-android-arm64/-/watcher-android-arm64-${WVER}.tgz" | \
              tar xz -C node_modules/@parcel/watcher-android-arm64 --strip-components=1
          fi
          ls -d node_modules/.bun/@parcel+watcher-android-arm64@*/node_modules/@parcel/watcher-android-arm64 2>/dev/null || \
            ls -d node_modules/@parcel/watcher-android-arm64
          if ! ls -d node_modules/.bun/@opencode-ai+pty-linux-arm64-musl@*/node_modules/@opencode-ai/pty-linux-arm64-musl 2>/dev/null; then
            echo "bun skipped pty musl package; fetching @opencode-ai/pty-linux-arm64-musl@$PTY_VERSION"
            mkdir -p node_modules/@opencode-ai/pty-linux-arm64-musl
            curl -fsSL "https://registry.npmjs.org/@opencode-ai/pty-linux-arm64-musl/-/pty-linux-arm64-musl-${PTY_VERSION}.tgz" | \
              tar xz -C node_modules/@opencode-ai/pty-linux-arm64-musl --strip-components=1
          fi
          ls -d node_modules/.bun/@opencode-ai+pty-linux-arm64-musl@*/node_modules/@opencode-ai/pty-linux-arm64-musl 2>/dev/null || \
            ls -d node_modules/@opencode-ai/pty-linux-arm64-musl
          ls node_modules/.bun/bun-pty@*/node_modules/bun-pty/rust-pty/target/release/librust_pty_arm64.so 2>/dev/null || \
            ls node_modules/bun-pty/rust-pty/target/release/librust_pty_arm64.so

      - name: Swap CI bionic lib into the npm musl slot (embed pure bionic)
        # Overwriting that file makes the binary self-contained: no musl
        # bytes, no runtime override needed.
        run: |
          MUSL_PKG=$(ls -d upstream/node_modules/.bun/@opentui+core-linux-arm64-musl@*/node_modules/@opentui/core-linux-arm64-musl)
          cp -v out/libopentui.so "$MUSL_PKG/libopentui.so"
          bash scripts/check-elf.sh --no-errno-location "$MUSL_PKG/libopentui.so"

      - name: Swap CI android PTY natives into embed slots
        # Daemon binary: android build goes into the linux-arm64-musl npm slot,
        # which resolveOpencodePty maps android->musl to (same trick as libopentui).
        # Inline lib: android cdylib overwrites bun-pty's glibc librust_pty_arm64.so,
        # which Bun's compile-time require picks for arm64 (no source change needed).
        run: |
          PTY_PKG=$(ls -d upstream/node_modules/.bun/@opencode-ai+pty-linux-arm64-musl@*/node_modules/@opencode-ai/pty-linux-arm64-musl 2>/dev/null || \
            ls -d upstream/node_modules/@opencode-ai/pty-linux-arm64-musl)
          cp -v out/opencode-pty "$PTY_PKG/bin/opencode-pty"
          chmod 755 "$PTY_PKG/bin/opencode-pty"
          RUSTPTY_DST=$(ls upstream/node_modules/.bun/bun-pty@*/node_modules/bun-pty/rust-pty/target/release/librust_pty_arm64.so 2>/dev/null || \
            ls upstream/node_modules/bun-pty/rust-pty/target/release/librust_pty_arm64.so)
          cp -v out/librust_pty_arm64.so "$RUSTPTY_DST"
          bash scripts/check-elf.sh --no-glibc "$RUSTPTY_DST"

      - name: Build CLI (android)
        # --skip-install: embed deps were fetched verbatim in the step above.
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          export PATH="$HOME/.bun/bin:$PATH"
          export BUN_COMPILE_RELEASE OPENCODE_VERSION OPENCODE_CHANNEL
          cd upstream/packages/cli || exit
          bun run script/build.ts --target=opencode-linux-arm64-android --skip-install --skip-web-ui --outdir="$GITHUB_WORKSPACE/dist/cli"
          ls -lh "$GITHUB_WORKSPACE/dist/cli/cli-linux-arm64-android/bin/opencode"

      - name: Free disk (node_modules, caches, archives)
        # Both builds are done; node_modules + bun/zig/cargo caches are GBs we no
        # longer need, and the 166M binary gets staged 3x during packaging.
        run: |
          df -h / /tmp
          rm -rf upstream/node_modules upstream/.git dist/cli/.bun \
            /tmp/zig.tar.xz /tmp/ndk.zip ~/.bun/install/cache ~/.cache/zig \
            work/opencode-pty-*/target work/bun-pty-*/rust-pty/target ~/.cargo/registry/cache
          df -h / /tmp

      - name: Package (zip, deb, pacman)
        env:
          UPSTREAM_TAG: ${{ needs.resolve.outputs.upstream_tag }}
          VERSION_SUFFIX: ${{ needs.resolve.outputs.version_suffix }}
        run: bash scripts/package.sh

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ needs.resolve.outputs.release_tag }}
          path: out/*

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.resolve.outputs.release_tag }}
          name: OpenCode ${{ needs.resolve.outputs.upstream_tag }} for Termux
          body: |
            Pure Android/aarch64 build of upstream OpenCode `${{ needs.resolve.outputs.upstream_tag }}`.
            Installs as `opencode2`; the installer links `opencode` → `opencode2` (v2 becomes default).
            Built weekly from https://github.com/anomalyco/opencode (see `docs/REPORT.md`).
          files: |
            out/*.zip
            out/*.deb
            out/*.pkg.tar.xz
            out/SHA256SUMS

      - name: Trigger APT repo publish
        # Releases created with GITHUB_TOKEN never fire downstream
        # `release: published` events, so publish the repo explicitly.
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.resolve.outputs.release_tag }}
        run: gh workflow run apt-repo.yml --ref master -f tag="$RELEASE_TAG"
